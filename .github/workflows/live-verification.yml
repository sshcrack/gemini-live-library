name: Live Gemini verification
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-gemini-verification
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: microsoft
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify one real provider session
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo 'Configure the GEMINI_API_KEY repository secret first.'; exit 1; }
          ./gradlew :1.21.1-neoforge:test --tests '*GeminiLiveIntegrationTest' --rerun --no-daemon --max-workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-provider-test-report
          path: versions/1.21.1-neoforge/build/reports/tests/
